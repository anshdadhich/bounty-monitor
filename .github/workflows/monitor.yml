name: bounty-monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bounty-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore state (Actions Cache - never committed)
        uses: actions/cache@v4
        with:
          path: state
          key: bounty-monitor-state-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan for new bounties
        run: python scan.py

      - name: Build site from dashboard
        run: |
          mkdir -p _site
          cp state/bounties.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
